name: Fomio
options:
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.0'
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: ''
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: LK9253R3XB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.8.0'
    CURRENT_PROJECT_VERSION: '1'
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Fomio:
    type: application
    platform: iOS
    sources: [Fomio]
    info:
      path: Fomio/Info.plist
      properties:
        # Custom keys are not emitted from INFOPLIST_KEY_* settings; they are merged from this file.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        FomioBaseURL: https://meta.fomio.app
        FomioAuthCallback: fomio://auth_redirect
        FomioUserAPIScopes: read,write,notifications,session_info
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.fomio.mobile
        INFOPLIST_KEY_CFBundleDisplayName: Fomio
  FomioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FomioTests]
    dependencies:
      - target: Fomio
  FomioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FomioUITests]
    dependencies:
      - target: Fomio
schemes:
  Fomio:
    build:
      targets:
        Fomio: all
    test:
      targets: [FomioTests, FomioUITests]
      gatherCoverageData: true
